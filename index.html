<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني المتكامل</title>
    <!-- مكتبة Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- شريط التنقل العلوي -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-6">
                <h1 class="text-2xl font-bold text-indigo-600">متجري</h1>
                <nav class="hidden md:flex gap-4 text-sm font-medium text-gray-600">
                    <a href="#" onclick="showSection('shop')" class="hover:text-indigo-600 transition">المنتجات</a>
                    <!-- لوحة التحكم تظهر فقط للمشرف -->
                    <a href="#" id="admin-nav-link" onclick="showSection('admin')" class="hover:text-indigo-600 transition text-indigo-600 font-bold hidden">لوحة التحكم الإدارية</a>
                </nav>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="toggleCart()" class="relative bg-gray-100 hover:bg-gray-200 p-2 rounded-full transition">
                    🛒 <span id="cart-count" class="absolute -top-1 -right-1 bg-indigo-600 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full">0</span>
                </button>
                <div id="auth-section">
                    <!-- سيتم تعبئته ديناميكياً -->
                </div>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- قسم المتجر -->
        <section id="shop-section">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">المنتجات المتاحة</h2>
            </div>
            <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- المنتجات تظهر هنا -->
            </div>
        </section>

        <!-- قسم لوحة التحكم الإدارية (خاص بالمشرف فقط) -->
        <section id="admin-section" class="hidden">
            <h2 class="text-2xl font-bold mb-6 text-gray-900">لوحة التحكم والإدارة</h2>
            
            <!-- إضافة منتج جديد -->
            <div class="bg-white p-6 rounded-xl shadow-sm mb-8 border border-gray-100">
                <h3 class="text-lg font-bold mb-4">إضافة منتج جديد للمتجر</h3>
                <form onsubmit="addProduct(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="new-name" placeholder="اسم المنتج" required class="px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="number" id="new-price" placeholder="السعر (ر.س)" required class="px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="text" id="new-image" placeholder="رابط صورة المنتج (URL)" required class="px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="submit" class="md:col-span-3 bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">إضافة المنتج</button>
                </form>
            </div>

            <!-- قائمة العملاء المسجلين -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-lg font-bold mb-4">العملاء المسجلون في المتجر</h3>
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="border-b text-gray-500 text-sm">
                            <th class="pb-3">#</th>
                            <th class="pb-3">البريد الإلكتروني</th>
                            <th class="pb-3">نوع الحساب</th>
                        </tr>
                    </thead>
                    <tbody id="customers-list">
                        <!-- العملاء يظهرون هنا -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- نافذة تسجيل الدخول -->
    <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-2xl w-96 shadow-xl relative">
            <button onclick="closeLoginModal()" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600 font-bold">✕</button>
            <h3 class="text-lg font-bold mb-4 text-center">تسجيل الدخول</h3>
            <form onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="user-email" required placeholder="name@example.com" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                    <input type="password" id="user-password" required placeholder="••••••••" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">دخول</button>
            </form>
        </div>
    </div>

    <!-- نافذة سلة المشتريات -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-end z-50">
        <div class="bg-white w-full max-w-md h-full p-6 flex flex-col shadow-xl">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 class="text-lg font-bold">سلة المشتريات</h3>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600 font-bold">✕</button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto space-y-4">
                <!-- المنتجات المضافة للسلة -->
            </div>
            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>الإجمالي:</span>
                    <span id="cart-total">0 ر.س</span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-600 text-white py-3 rounded-lg font-medium hover:bg-green-700 transition">إتمام الشراء</button>
            </div>
        </div>
    </div>

    <script>
        // بيانات المشرف الأساسية للتحكم الكامل
        const ADMIN_EMAIL = "Ksakdbdj@gmail.com";
        const ADMIN_PASS = "Sksjsssjssssn@";

        let products = [
            { id: 1, name: "سماعة لاسلكية ذكية", price: 299, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" },
            { id: 2, name: "حامل جوال مغناطيسي", price: 89, image: "https://images.unsplash.com/photo-1586953208448-b95a797e8f07?w=300" },
            { id: 3, name: "ساعة رياضية رقمية", price: 199, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300" }
        ];

        let cart = [];

        function showSection(section) {
            if (section === 'shop') {
                document.getElementById('shop-section').classList.remove('hidden');
                document.getElementById('admin-section').classList.add('hidden');
            } else {
                // التحقق هل المستخدم هو المشرف لفتح لوحة التحكم
                const email = localStorage.getItem('user_email');
                if (email !== ADMIN_EMAIL) {
                    alert('عذراً، لوحة التحكم خاصة بالمشرف فقط.');
                    showSection('shop');
                    return;
                }
                document.getElementById('shop-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                loadCustomers();
            }
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = products.map(p => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div>
                        <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover rounded-lg mb-4">
                        <h3 class="font-bold text-lg mb-1">${p.name}</h3>
                        <p class="text-indigo-600 font-bold mb-4">${p.price} ر.س</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="w-full bg-gray-900 text-white py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition">إضافة للسلة</button>
                </div>
            `).join('');
        }

        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('user-email').value;
            const password = document.getElementById('user-password').value;

            // التحقق من بيانات المشرف
            if (email === ADMIN_EMAIL && password === ADMIN_PASS) {
                localStorage.setItem('user_email', email);
                closeLoginModal();
                checkAuth();
                alert('مرحباً بك أيها المشرف، تم تسجيل الدخول بنجاح.');
            } else {
                // تسجيل دخول عادي لأي مستخدم آخر
                localStorage.setItem('user_email', email);
                closeLoginModal();
                checkAuth();
                alert('تم تسجيل الدخول بنجاح');
            }
        }

        function checkAuth() {
            const email = localStorage.getItem('user_email');
            const authSection = document.getElementById('auth-section');
            const adminNavLink = document.getElementById('admin-nav-link');

            if (email) {
                authSection.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full font-medium">👤 ${email}</span>
                        <button onclick="logout()" class="text-red-500 text-xs hover:underline">خروج</button>
                    </div>
                `;
                // إظهار زر لوحة التحكم فقط إذا كان الحساب هو حساب المشرف
                if (email === ADMIN_EMAIL) {
                    adminNavLink.classList.remove('hidden');
                } else {
                    adminNavLink.classList.add('hidden');
                }
            } else {
                authSection.innerHTML = `<button onclick="openLoginModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">تسجيل الدخول</button>`;
                adminNavLink.classList.add('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('user_email');
            checkAuth();
            showSection('shop');
            alert('تم تسجيل الخروج بنجاح.');
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        function addToCart(id) {
            const email = localStorage.getItem('user_email');
            if (!email) {
                alert('الرجاء تسجيل الدخول أولاً لإضافة المنتجات');
                openLoginModal();
                return;
            }
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartUI();
            alert('تمت إضافة المنتج إلى السلة');
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-8">السلة فارغة</p>`;
            } else {
                container.innerHTML = cart.map((item, index) => {
                    total += item.price;
                    return `
                        <div class="flex justify-between items-center border-b pb-3">
                            <div>
                                <h4 class="font-bold text-sm">${item.name}</h4>
                                <span class="text-indigo-600 text-sm">${item.price} ر.س</span>
                            </div>
                            <button onclick="removeFromCart(${index})" class="text-red-500 text-xs">حذف</button>
                        </div>
                    `;
                }).join('');
            }
            document.getElementById('cart-total').innerText = total + ' ر.س';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function checkout() {
            if (cart.length === 0) return alert('السلة فارغة!');
            alert('تم إتمام الطلب بنجاح وسيتم إرسال تفاصيل التوصيل لبريدك.');
            cart = [];
            updateCartUI();
            toggleCart();
        }

        function addProduct(e) {
            e.preventDefault();
            const name = document.getElementById('new-name').value;
            const price = parseFloat(document.getElementById('new-price').value);
            const image = document.getElementById('new-image').value;

            products.push({ id: products.length + 1, name, price, image });
            renderProducts();
            
            document.getElementById('new-name').value = '';
            document.getElementById('new-price').value = '';
            document.getElementById('new-image').value = '';
            alert('تمت إضافة المنتج بنجاح');
            showSection('shop');
        }

        function loadCustomers() {
            const list = document.getElementById('customers-list');
            const email = localStorage.getItem('user_email');
            if (email) {
                const role = email === ADMIN_EMAIL ? 'مشرف رئيسي (تحكم كامل)' : 'عميل نشط';
                const badgeColor = email === ADMIN_EMAIL ? 'bg-purple-100 text-purple-700' : 'bg-green-100 text-green-700';
                list.innerHTML = `
                    <tr class="border-b text-sm">
                        <td class="py-3">1</td>
                        <td class="py-3 font-medium">${email}</td>
                        <td class="py-3"><span class="${badgeColor} px-2 py-1 rounded text-xs">${role}</span></td>
                    </tr>
                `;
            } else {
                list.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-gray-400">لا يوجد عملاء مسجلين حتى الآن</td></tr>`;
            }
        }

        window.onload = function() {
            renderProducts();
            checkAuth();
        };
    </script>
</body>
</html>
