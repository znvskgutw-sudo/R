<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة استخراج النصوص - Dragon Studio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 { color: #333; margin-top: 0; }
        
        .drop-zone {
            border: 2px dashed #ccc;
            padding: 40px;
            text-align: center;
            color: #777;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .drop-zone:hover { border-color: #555; }

        textarea {
            width: 100%;
            height: 200px;
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: monospace;
            box-sizing: border-box;
        }

        .btn {
            background-color: #5865F2; /* لون الديسكورد */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .discord-link {
            color: #5865F2;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>استخراج محتوى الملف</h2>
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        اضغط هنا أو اسحب الملف للإفلات
        <input type="file" id="fileInput" hidden>
    </div>

    <div id="outputSection" style="display:none;">
        <button class="btn" id="copyBtn">نسخ الكود</button>
        <textarea id="codeOutput" readonly></textarea>
    </div>

    <div class="footer">
        <p>تم التصميم بواسطة <b>Dragon Studio</b></p>
        <p>انضم إلينا في سيرفر ديسكورد: <a href="https://discord.gg/dr10" class="discord-link" target="_blank">Dragon Studio Discord</a></p>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const codeOutput = document.getElementById('codeOutput');
    const outputSection = document.getElementById('outputSection');
    const copyBtn = document.getElementById('copyBtn');

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                codeOutput.value = e.target.result;
                outputSection.style.display = 'block';
            };
            reader.readAsText(file);
        }
    });

    copyBtn.addEventListener('click', () => {
        codeOutput.select();
        document.execCommand('copy');
        alert('تم النسخ!');
    });
</script>

</body>
</html>
