<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEM - Profile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0b050f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background: rgba(244, 114, 182, 0.15);
            filter: blur(100px);
            z-index: -1;
        }

        .header {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffffff 0%, #f472b6 50%, #db2777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            text-shadow: 0 0 20px rgba(244, 114, 182, 0.3);
        }

        .profile-card {
            width: 100%;
            max-width: 400px;
            background: rgba(25, 14, 30, 0.7);
            border: 1.5px solid rgba(244, 114, 182, 0.3);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(244, 114, 182, 0.1);
            backdrop-filter: blur(10px);
            text-align: center;
            margin-bottom: 25px;
        }

        .avatar-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #ffffff, #f472b6);
            box-shadow: 0 0 25px rgba(244, 114, 182, 0.5);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #111;
        }

        .profile-name {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .profile-bio {
            font-size: 15px;
            color: #fbcfe8;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background: linear-gradient(135deg, #f472b6 0%, #be185d 100%);
            color: #ffffff;
            padding: 16px;
            font-family: 'Tajawal', sans-serif;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(244, 114, 182, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(244, 114, 182, 0.5);
            background: linear-gradient(135deg, #fb7185 0%, #9d174d 100%);
        }

        .social-btn.discord {
            background: linear-gradient(135deg, #5865F2 0%, #3c45a5 100%);
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.35);
        }
        .social-btn.discord:hover {
            background: linear-gradient(135deg, #6e79f5 0%, #31388a 100%);
        }

        .social-btn.roblox {
            background: linear-gradient(135deg, #e11d48 0%, #881337 100%);
            box-shadow: 0 8px 20px rgba(225, 29, 72, 0.35);
        }
        .social-btn.roblox:hover {
            background: linear-gradient(135deg, #f43f5e 0%, #9f1239 100%);
        }

        .social-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="header">MEM</div>
