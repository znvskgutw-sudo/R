<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTX - MEM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            /* الخلفية الداكنة الثانية */
            background-color: #0b050f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* تأثير الخلفية الثانية (التوهج الوردي) */
        body::before {
            content: '';
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 400px;
            background: rgba(244, 114, 182, 0.1);
            filter: blur(100px);
            z-index: -1;
        }

        /* الهيدر العلوي */
        .header {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffffff 0%, #f472b6 50%, #db2777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(244, 114, 182, 0.4);
        }

        /* الصورة المستطيلة (فوق) */
        .top-banner {
            width: 100%;
            max-width: 380px;
            background: #13081d;
            border: 2px solid #3b2064;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            margin-bottom: 15px;
            text-align: center;
            padding: 5px;
        }

        .top-banner img {
            width: 100%;
            display: block;
            border-radius: 12px;
        }

        /* الصورة الدائرية (تحت المستطيلة) */
        .profile-avatar {
            width: 110px;
            height: 110px;
            margin-bottom: 15px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #ffffff, #f472b6);
            box-shadow: 0 0 25px rgba(244, 114, 182, 0.6);
            position: relative;
            z-index: 1;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #111;
        }

        /* بطاقة المعلومات والروابط */
        .info-card {
            width: 100%;
            max-width: 380px;
            background: rgba(25, 14, 30, 0.7);
            border: 1.5px solid rgba(244, 114, 182, 0.3);
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            text-align: center;
            margin-bottom: 15px;
        }

        .mem-name {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        /* أزرار التحميل */
        .download-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
            color: #ffffff;
            padding: 15px;
            font-family: 'Tajawal', sans-serif;
            font-size: 17px;
            font-weight: 700;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

        .download-btn:active {
            transform: scale(0.97);
        }

        .download-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* زر التيك توك (لون خاص) */
        .download-btn.tiktok {
            background: linear-gradient(135deg, #f472b6 0%, #be185d 100%);
            box-shadow: 0 6px 20px rgba(244, 114, 182, 0.4);
        }

        /* نافذة التثبيت المنبثقة (تشبه الآيفون) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-box {
            background: #1e1b2e;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px 20px;
            border-radius: 24px;
            width: 85%;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .modal-text {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-cancel, .btn-install {
            flex: 1;
            padding: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .btn-cancel {
            background: #2d2640;
            color: #a78bfa;
        }

        .btn-install {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="header">RTX | MEM</div>

    <div class="top-banner">
        <img src="https://i.imgur.com/8Kz0aZJ.gif" alt="Delta Zsign Banner">
    </div>

    <div class="profile-avatar">
        <img src="https://i.imgur.com/6X1omUB.png" alt="MEM Avatar">
    </div>

    <div class="info-card">
        <div class="mem-name">ميم | MEM</div>
        <div class="section-title">حسابات ميم وروابط التحميل</div>

        <a href="https://www.tiktok.com/@.mo..il" target="_blank" class="download-btn tiktok">
            <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
            <span>TikTok: .mo..il</span>
        </a>

        <button onclick="openModal()" class="download-btn">
            <span>Install Zsign</span>
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </button>
    </div>

    <div id="installModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-text">يرغب الموقع في تثبيت "Zsign 2.0"</div>
            <div class="modal-buttons">
                <button onclick="closeModal()" class="btn-cancel">إلغاء</button>
                <a href="حط_رابط_ملف_Zsign_المباشر_هنا.ipa" onclick="closeModal()" class="btn-install">تثبيت</a>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('installModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('installModal').style.display = 'none';
        }
    </script>

</body>
</html>
