<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEM | ميم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }
        body {
            background-color: #0b050f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1.title {
            color: #ffb6c1;
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        /* تصميم البانر */
        .banner-box {
            width: 100%;
            height: 180px;
            border: 1px solid #ffb6c1;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.2);
            margin-bottom: -40px;
            z-index: 1;
        }
        .banner-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* تصميم الصورة الشخصية (الأفاتار) */
        .avatar-box {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #ffb6c1;
            overflow: hidden;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.4);
            background-color: #000;
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* صندوق الروابط */
        .links-card {
            width: 100%;
            background-color: #170d1e;
            border: 1px solid #ffb6c1;
            border-radius: 20px;
            padding: 50px 20px 20px 20px;
            margin-top: -50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .profile-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #fff;
        }
        .btn {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 30px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            color: #fff;
            display: block;
            transition: 0.2s;
        }
        .btn-tiktok {
            background: linear-gradient(45deg, #d62976, #fa7e1e);
        }
        .btn-discord {
            background: linear-gradient(45deg, #5865F2, #7289DA);
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title">MEM</h1>

        <!-- البانر -->
        <div class="banner-box">
            <img src="IMG_4842.gif" alt="MEM Banner">
        </div>

        <!-- الأفاتار (الصورة الدائرية) -->
        <div class="avatar-box">
            <img src="IMG_4846.jpeg" alt="MEM Avatar">
        </div>

        <!-- الروابط -->
        <div class="links-card">
            <div class="profile-name">MEM | ميم</div>
            
            <a href="https://tiktok.com/@.mo..il" target="_blank" class="btn btn-tiktok">
                TikTok: .mo..il
            </a>
            
            <a href="#" target="_blank" class="btn btn-discord">
                Discord Server
            </a>
        </div>
    </div>

</body>
</html>
