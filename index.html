<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEM - Profile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0b050f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 400px;
            background: rgba(244, 114, 182, 0.12);
            filter: blur(100px);
            z-index: -1;
        }

        .header {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffffff 0%, #f472b6 50%, #db2777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(244, 114, 182, 0.4);
        }

        /* الصورة المستطيلة فوق */
        .top-banner {
            width: 100%;
            max-width: 380px;
            background: #13081d;
            border: 2px solid rgba(244, 114, 182, 0.4);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            margin-bottom: 15px;
            text-align: center;
            padding: 5px;
        }

        .top-banner img {
            width: 100%;
            display: block;
            border-radius: 14px;
        }

        /* الصورة الدائرية تحت المستطيلة */
        .profile-avatar {
            width: 110px;
            height: 110px;
            margin-bottom: 15px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #ffffff, #f472b6);
            box-shadow: 0 0 25px rgba(244, 114, 182, 0.6);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #111;
        }

        .info-card {
            width: 100%;
            max-width: 380px;
            background: rgba(25, 14, 30, 0.75);
            border: 1.5px solid rgba(244, 114, 182, 0.3);
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            text-align: center;
            margin-bottom: 15px;
        }

        .mem-name {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background: linear-gradient(135deg, #f472b6 0%, #be185d 100%);
            color: #ffffff;
            padding: 15px;
            font-family: 'Tajawal', sans-serif;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(244, 114, 182, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(244, 114, 182, 0.5);
        }

        .social-btn.discord {
            background: linear-gradient(135deg, #5865F2 0%, #3c45a5 100%);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.35);
        }

        .social-btn.roblox {
            background: linear-gradient(135deg, #e11d48 0%, #881337 100%);
            box-shadow: 0 6px 20px rgba(225, 29, 72, 0.35);
        }

        /* لون مميز لزر تثبيت ملف التعريف */
        .social-btn.profile-install {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.35);
        }

        .social-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="header">MEM</div>

    <div class="top-banner">

    <div class="profile-avatar">

</body>
