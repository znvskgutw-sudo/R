<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إبراهيم الفضل</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .name {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .role {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 1);
            margin: 20px 0;
        }

        .footer-text {
            font-size: 13px;
            color: #64748b;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">القيادة العليا</div>
        <div class="name">إبراهيم الفضل</div>
        <div class="role">الصرامة، الحكمة، وإدارة الموقف</div>
        <div class="divider"></div>
        <div class="footer-text">Brigadier General Meshal Sector</div>
    </div>

</body>
</html>
