<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Studio | Code Extractor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #050509; /* لون خلفية داكن جداً وفخم */
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 800px;
        }

        .app-container {
            background: linear-gradient(145deg, #1a1a2e, #12121f);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(90, 100, 234, 0.1);
            border: 1px solid #2a2a3f;
            position: relative;
            overflow: hidden;
        }

        /* تأثير ضوئي خفيف في الخلفية */
        .app-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(90, 100, 234, 0.06) 0%, rgba(5, 5, 9, 0) 60%);
            z-index: 0;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .header h1 span {
            color: #5865F2; /* لون الديسكورد */
        }

        .header p {
            color: #8b9bb4;
            font-size: 1rem;
        }

        /* منطقة السحب والإفلات */
        .drop-zone {
            border: 2px dashed #3a3a55;
            border-radius: 15px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(25, 25, 45, 0.5);
            position: relative;
            z-index: 1;
            margin-bottom: 25px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: #5865F2;
            background: rgba(90, 100, 234, 0.1);
            box-shadow: 0 0 15px rgba(90, 100, 234, 0.2);
        }

        .drop-zone i {
            font-size: 3rem;
            color: #5865F2;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .drop-zone:hover i {
            transform: translateY(-5px);
        }

        .drop-zone p {
            font-size: 1.2rem;
            color: #c0ccda;
            margin-bottom: 5px;
        }

        .drop-zone span {
            font-size: 0.9rem;
            color: #7888a5;
        }

        #fileInput {
            display: none;
        }

        /* منطقة النتائج */
        .output-section {
            display: none;
            position: relative;
            z-index: 1;
            animation: slideInUp 0.5s ease;
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tool-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: rgba(25, 25, 45, 0.7);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #2a2a3f;
        }

        .file-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #a0aec0;
            font-size: 0.9rem;
        }

        .file-meta i {
            color: #5865F2;
        }

        .copy-btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .copy-btn:hover {
            background-color: #4752c4;
            box-shadow: 0 4px 10px rgba(88, 101, 242, 0.3);
        }

        .copy-btn:active {
            transform: scale(0.97);
        }

        .copy-btn.copied {
            background-color: #2ecc71; /* لون النجاح */
        }

        textarea.code-area {
            width: 100%;
            height: 300px;
            background-color: #0d0d15;
            border: 1px solid #2a2a3f;
            border-radius: 10px;
            padding: 20px;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace; /* خط مخصص للأكواد */
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }

        textarea.code-area:focus {
            border-color: #5865F2;
        }

        /* Footer الفخم */
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #7888a5;
            font-size: 0.9rem;
            padding: 20px;
            border-top: 1px solid #1a1a2e;
            position: relative;
            z-index: 1;
        }

        .footer .creator {
            margin-bottom: 10px;
        }

        .footer .creator b {
            color: #fff;
            font-weight: 700;
        }

        .discord-f-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #2c2f33; /* لون ديسكورد غامق */
            color: #fff;
            padding: 10px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .discord-f-btn:hover {
            background-color: #5865F2;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.4);
        }

        .discord-f-btn i {
            font-size: 1.2rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .app-container { padding: 20px; }
            .header h1 { font-size: 1.8rem; }
            .drop-zone { padding: 30px 10px; }
            .tool-bar { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="app-container">
            <div class="header">
                <h1><span>Dragon</span> Studio</h1>
                <p>أداة استخراج الأكواد والنصوص الاحترافية</p>
            </div>

            <!-- منطقة السحب والإفلات -->
            <div class="drop-zone" id="dropZone">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>اسحب وأفلت الملف هنا</p>
                <span>أو اضغط لاختيار ملف من جهازك</span>
                <input type="file" id="fileInput">
            </div>

            <!-- منطقة النتائج (مخفية افتراضياً) -->
            <div class="output-section" id="outputSection">
                <div class="tool-bar">
                    <div class="file-meta">
                        <i class="fas fa-file-code"></i>
                        <span id="fileName">document.txt</span>
                    </div>
                    <button class="copy-btn" id="copyBtn">
                        <i class="fas fa-copy"></i> نسخ
                    </button>
                </div>
                <textarea class="code-area" id="codeOutput" readonly placeholder="سيظهر محتوى الملف هنا..."></textarea>
            </div>
        </div>

        <!-- قسم الحقوق والديسكورد -->
        <div class="footer">
            <div class="creator">
                تم التصميم والبرمجة بواسطة: <b>Dragon Studio</b>
            </div>
            <a href="https://discord.gg/dr10" target="_blank" class="discord-f-btn">
                <i class="fab fa-discord"></i> انضم لسيرفرنا
            </a>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const outputSection = document.getElementById('outputSection');
        const codeOutput = document.getElementById('codeOutput');
        const fileNameSpan = document.getElementById('fileName');
        const copyBtn = document.getElementById('copyBtn');

        // تفعيل الضغط على منطقة السحب لفتح مستعرض الملفات
        dropZone.addEventListener('click', () => fileInput.click());

        // تأثيرات السحب والإفلات
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            }, false);
        });

        // التعامل مع الملف عند إفلاته
        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // التعامل مع الملف عند اختياره عبر التصفح
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // الوظيفة الأساسية لقراءة الملف وعرضه
        function handleFile(file) {
            // التحقق من حجم الملف (اختياري، مثلاً حد أقصى 1 ميجابايت)
            if (file.size > 1024 * 1024) {
                alert('عذراً، حجم الملف كبير جداً. الحد الأقصى هو 1 ميجابايت.');
                return;
            }

            fileNameSpan.textContent = file.name;
            const reader = new FileReader();

            reader.onload = function(e) {
                codeOutput.value = e.target.result;
                outputSection.style.display = 'block';
                
                // تمرير الشاشة تلقائياً إلى منطقة النتائج
                outputSection.scrollIntoView({ behavior: 'smooth' });
            };

            // قراءة الملف كنص
            reader.readAsText(file);
        }

        // وظيفة زر النسخ
        copyBtn.addEventListener('click', () => {
            if (!codeOutput.value) return;

            // استخدام Clipboard API الحديث
            navigator.clipboard.writeText(codeOutput.value).then(() => {
                // تغيير مظهر الزر مؤكداً للنسخ
                const originalHTML = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check"></i> تم النسخ';
                copyBtn.classList.add('copied');
                copyBtn.disabled = true;

                // العودة للوضع الأصلي بعد ثانيتين
                setTimeout(() => {
                    copyBtn.innerHTML = originalHTML;
                    copyBtn.classList.remove('copied');
                    copyBtn.disabled = false;
                }, 2000);
            }).catch(err => {
                console.error('فشل النسخ: ', err);
                alert('حدث خطأ أثناء النسخ.');
            });
        });
    </script>
</body>
</html>
